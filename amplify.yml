version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm use 20 || true
        - env | grep -e VITE_ >> .env.production || true
        - npm install
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
